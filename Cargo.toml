[workspace]
resolver = "3"
members = ["crates/baukfs", "crates/baukfs-cli", "crates/baukfs-turso-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
baukfs = { path = "crates/baukfs" }
blake3 = { version = "=1.8.7", default-features = false }
turso = { version = "=0.8.3", default-features = false }
libc = "=0.2.191"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
